<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Mascot for Muse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="mode-small">
  <div class="gadget-container">
    <!-- Header (window drag area) -->
    <header class="gadget-header" id="drag-header">
      <div class="brand-group">
        <div class="status-dot warning" id="status-dot" title="Connection status"></div>
        <span class="app-title">Muse</span>
        <span class="plan-badge" id="plan-badge">Free Plan</span>
      </div>
      <div class="header-controls">
        <button class="icon-btn" id="btn-open-browser" title="Open Muse in the browser (R6)">🌐</button>
        <button class="icon-btn" id="btn-toggle-session" title="Session screen (official UI / sign-in)">🖥️</button>
        <button class="icon-btn" id="btn-refresh-all" title="Sync everything now">↻</button>
        <button class="icon-btn" id="btn-toggle-size" title="Toggle size (small ⇄ large, R7)">⤢</button>
        <button class="win-btn" id="btn-minimize" title="Minimize">−</button>
        <button class="win-btn close" id="btn-close" title="Close">×</button>
      </div>
    </header>

    <!-- Hero card: avatar (R1) & usage limit meter (R5) -->
    <section class="hero-card bubble-on-left" id="hero-card">
      <!-- Left: avatar display + name -->
      <div class="avatar-column" id="avatar-column">
        <div class="avatar-holder" id="avatar-holder">
          <div class="avatar-wrapper" id="avatar-container" title="Click for a reaction / double-click to open the screen">
            <video id="avatar-video-a" class="avatar-video active" autoplay loop muted playsinline></video>
            <video id="avatar-video-b" class="avatar-video" autoplay loop muted playsinline></video>
            <div class="avatar-fallback hidden" id="avatar-fallback">
              <div class="avatar-ring"></div>
              <span class="avatar-placeholder-text">Muse</span>
              <button class="avatar-fetch-btn" id="btn-fetch-avatar" title="Fetch video">Fetch</button>
            </div>
            <div class="mascot-restore-btn" id="mascot-restore-btn" title="Restore to the normal screen">⤢</div>
          </div>
          <div class="unread-badge hidden" id="unread-badge" style="display: none;" title="You have unread messages (click to open)"></div>
          <button class="mascot-quick-input-btn" id="btn-mascot-quick-input" title="Type a question (💬)">💬</button>
        </div>
        <div class="avatar-name" id="avatar-name" title="Click to refresh the usage limit / drag to move">
          <span class="avatar-name-text" id="avatar-name-text">Lucky</span>
          <span class="avatar-limit-badge" id="avatar-limit-badge">--%</span>
        </div>
        <!-- Mascot-mode only: avatar status pill (Issue #35: shown only while working) -->
        <div class="avatar-status-pill hidden" id="avatar-status-pill">
          <span class="avatar-status-text" id="avatar-status-text">🛠️ Working</span>
        </div>
      </div>

      <!-- Mascot-mode only: quick one-line mini input bar (Issue #27) + one-click shortcuts (Issue #68) -->
      <div class="mascot-input-bar hidden" id="mascot-input-bar">
        <div class="mascot-input-tail"></div>
        <div class="mascot-input-row">
          <span class="mascot-input-icon">💬</span>
          <input type="text" class="mascot-input-field" id="mascot-input-field" placeholder="Ask Muse... (Enter to send / Esc to close)" autocomplete="off" />
          <button class="mascot-input-btn-send" id="btn-mascot-input-send" title="Send (Enter)">➤</button>
          <button class="mascot-input-btn-close" id="btn-mascot-input-close" title="Close (Esc)">×</button>
        </div>
        <div class="mascot-shortcut-panel" id="mascot-shortcut-panel">
          <div class="mascot-shortcut-header">
            <span class="mascot-shortcut-title">✨ One-click shortcuts</span>
            <span class="mascot-shortcut-note" id="mascot-shortcut-note">Tap to fill the input field (sending uses 1 turn)</span>
          </div>
          <div class="mascot-shortcut-chips" id="mascot-shortcut-chips"></div>
        </div>
      </div>

      <!-- Mascot-mode only: Lupin-style speech bubble -->
      <div class="mascot-bubble hidden" id="mascot-bubble" title="Click to open the normal screen">
        <div class="mascot-bubble-tail"></div>
        <div class="mascot-bubble-header">
          <span class="mascot-bubble-title">Muse</span>
          <button class="mascot-bubble-close" id="btn-bubble-close" title="Close">×</button>
        </div>
        <div class="mascot-bubble-body"><span class="mascot-bubble-text" id="mascot-bubble-text"></span><span class="mascot-bubble-cursor" id="mascot-bubble-cursor">▍</span><div class="mascot-bubble-options hidden" id="mascot-bubble-options"></div></div>
      </div>

      <!-- Right: usage limit meter -->
      <div class="limit-box">
        <div class="limit-header">
          <span class="limit-title">Usage limit (Weekly)</span>
          <span class="limit-percent" id="limit-percent-text">--%</span>
        </div>
        <div class="progress-bar-container">
          <div class="progress-bar" id="limit-progress-bar" style="width: 0%;"></div>
        </div>
        <div class="limit-footer">
          <span class="limit-reset-text" id="limit-reset-text">Loading...</span>
          <button class="btn-micro" id="btn-refresh-limit" title="Refresh usage limit">Refresh</button>
        </div>
      </div>
    </section>

    <!-- Chat thread area (R2) -->
    <section class="chat-section">
      <div class="chat-header">
        <span class="chat-header-title">Main chat</span>
        <div class="chat-header-actions">
          <span class="chat-sync-indicator" id="chat-sync-indicator"></span>
          <select id="msg-limit-select" class="select-micro" title="Number of messages shown">
            <option value="3">3</option>
            <option value="5" selected>5</option>
            <option value="10">10</option>
            <option value="15">15</option>
          </select>
        </div>
      </div>

      <!-- Message list -->
      <div class="chat-messages" id="chat-messages">
        <div class="chat-placeholder">
          <p class="placeholder-main">Loading chat...</p>
          <p class="placeholder-sub">* If nothing shows yet, please sign in on the session screen</p>
          <button class="btn-login-open" id="btn-open-session-empty">🖥️ Open the session screen</button>
        </div>
      </div>
    </section>

    <!-- Message input & send area (R3) -->
    <footer class="chat-footer">
      <div class="input-container">
        <textarea
          id="chat-input"
          class="chat-textarea"
          placeholder="Type a message to Muse... (Enter to send)"
          rows="1"
        ></textarea>
        <button id="btn-send-message" class="btn-send" title="Send (Enter)">
          <span class="send-icon">➤</span>
        </button>
      </div>
      <div class="footer-tips">
        <span class="hotkey-tip">Hotkey: <kbd>Ctrl+Shift+M</kbd></span>
        <div class="health-badges" id="health-badges" title="DOM selector health (§17)">
          <span class="health-pill" id="health-r1" title="R1: Avatar video selector">R1</span>
          <span class="health-pill" id="health-r2" title="R2: Chat history selector">R2</span>
          <span class="health-pill" id="health-r3" title="R3: Message send selector">R3</span>
          <span class="health-pill" id="health-r5" title="R5: Usage limit selector">R5</span>
        </div>
        <span class="sync-status" id="footer-sync-time">Not synced</span>
      </div>
    </footer>
  </div>

  <script src="main.js"></script>
</body>
</html>
