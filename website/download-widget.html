<!DOCTYPE html>
<!--
  Desktop Mascot for Muse — Download widget
  ------------------------
  This is a standalone, self-contained HTML/CSS/JS component—
  you can embed it into any page of your website using an `<iframe>`,
  or simply copy and paste the `<div id="zaheer-download">...</div>`
  section (along with the script tag) into your page's HTML.

  How it works:
  - It fetches the latest release data itself from the 
  GitHub Releases API (public; no backend required).
  - It infers the visitor's OS (Windows/macOS/Linux) 
  from their user agent and displays a "Download" 
  button for the appropriate installer for that OS.
  - Links to other platforms are also listed below.
  - The files are actually served from GitHub Releases (direct 
  downloads) — so there are no additional hosting or bandwidth costs for 
  your own website.

  Setup: Replace `GITHUB_OWNER` and `GITHUB_REPO` below with your actual 
  GitHub username/repository.
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Download Desktop Mascot for Muse</title>
<style>
  #zaheer-download {
    font-family: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    background: #1a1c22;
    border: 1px solid #2b2e37;
    border-radius: 14px;
    padding: 28px;
    color: #eef0f4;
    text-align: center;
  }
  #zaheer-download .zb-version {
    font-size: 12.5px;
    color: #9497a3;
    margin-bottom: 18px;
  }
  #zaheer-download .zb-primary-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #7c5cff;
    color: white;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    padding: 13px 26px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }
  #zaheer-download zb-primary-btn:hover { filter: brightness(1.08); }
  #zaheer-download .zb-other-platforms {
    margin-top: 18px;
    font-size: 12.5px;
    color: #9497a3;
  }
  #zaheer-download .zb-other-platforms a {
    color: #9497a3;
    text-decoration: underline;
    margin: 0 6px;
    cursor: pointer;
  }
  #zaheer-download .zb-other-platforms a:hover { color: #eef0f4; }
  #zaheer-download .zb-error {
    color: #ef5b5b;
    font-size: 13px;
  }
</style>
</head>
<body>

<div id="zaheer-download">
  <div class="zb-version">Loading latest version…</div>
  <div class="zb-buttons"></div>
  <div class="zb-other-platforms"></div>
</div>

<script>
(function () {
  // ---- SETUP: Enter your GitHub username/repo here ----------------------
  var GITHUB_OWNER = "DashingMZA";
  var GITHUB_REPO = "desktop-mascot-for-muse";
  // -------------------------------------------------------------------------

  var root = document.getElementById("zaheer-download");
  var versionEl = root.querySelector(".zb-version");
  var buttonsEl = root.querySelector(".zb-buttons");
  var otherEl = root.querySelector(".zb-other-platforms");

  function detectOS() {
    var ua = navigator.userAgent;
    if (/Windows/i.test(ua)) return "windows";
    if (/Macintosh|Mac OS X/i.test(ua)) return "macos";
    if (/Linux/i.test(ua)) return "linux";
    return "unknown";
  }

  // Asset filename patterns generated by the platform.
  function classify(assetName) {
    var n = assetName.toLowerCase();
    if (n.endsWith(".msi")) return { os: "windows", label: "Windows (.msi)" };
    if (n.endsWith("-setup.exe") || n.endsWith(".exe")) return { os: "windows", label: "Windows (.exe)" };
    if (n.includes("aarch64") && n.endsWith(".dmg")) return { os: "macos", label: "macOS (Apple Silicon)" };
    if ((n.includes("x64") || n.includes("x86_64")) && n.endsWith(".dmg")) return { os: "macos", label: "macOS (Intel)" };
    if (n.endsWith(".dmg")) return { os: "macos", label: "macOS" };
    if (n.endsWith(".appimage")) return { os: "linux", label: "Linux (.AppImage)" };
    if (n.endsWith(".deb")) return { os: "linux", label: "Linux (.deb)" };
    if (n.endsWith(".rpm")) return { os: "linux", label: "Linux (.rpm)" };
    return null;
  }

  function button(url, label, primary) {
    var a = document.createElement("a");
    a.href = url;
    a.className = primary ? "zb-primary-btn" : "";
    a.textContent = (primary ? "⬇ Download for " : "") + label;
    if (!primary) {
      a.style.cssText = "";
    }
    return a;
  }

  fetch("https://api.github.com/repos/" + GITHUB_OWNER + "/" + GITHUB_REPO + "/releases/latest")
    .then(function (r) {
      if (!r.ok) throw new Error("Release fetch failed");
      return r.json();
    })
    .then(function (release) {
      var tag = release.tag_name || "";
      versionEl.textContent = "Latest version: " + tag;

      var assets = (release.assets || [])
        .map(function (a) {
          var info = classify(a.name);
          return info ? { url: a.browser_download_url, name: a.name, os: info.os, label: info.label } : null;
        })
        .filter(Boolean);

      var myOS = detectOS();
      var primary = assets.find(function (a) { return a.os === myOS; }) || assets[0];

      if (!primary) {
        versionEl.textContent = "";
        buttonsEl.innerHTML = '<div class="zb-error">No downloadable file was found in this release.</div>';
        return;
      }

      buttonsEl.appendChild(button(primary.url, primary.label, true));

      var others = assets.filter(function (a) { return a !== primary; });
      if (others.length) {
        var wrap = document.createElement("div");
        wrap.textContent = "Or else : ";
        others.forEach(function (a, i) {
          var link = document.createElement("a");
          link.href = a.url;
          link.textContent = a.label;
          wrap.appendChild(link);
          if (i < others.length - 1) wrap.appendChild(document.createTextNode(" · "));
        });
        otherEl.appendChild(wrap);
      }
    })
    .catch(function () {
      versionEl.textContent = "";
      buttonsEl.innerHTML =
        '<div class="zb-error">The download links could not be loaded at this time. ' +
        '<a href="https://github.com/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/releases/latest" style="color:#7c5cff">' +
        "Go to GitHub Releases page</a>.</div>";
    });
})();
</script>

</body>
</html>
